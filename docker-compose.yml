services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: arge_user
      POSTGRES_PASSWORD: arge_pass
      POSTGRES_DB: telemetry_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  anomaly_service:
    build: ./anomaly_service
    ports:
      - "8001:8001"

  ingestion_service:
    build: ./ingestion_service
    ports:
      - "8000:8000"
    environment:
      - DataBase_Url=postgresql://arge_user:arge_pass@postgres:5432/telemetry_db
      - Redis_Host=redis
      - Service_Url=http://anomaly_service:8001/predict
    depends_on:
      - postgres
      - redis
      - anomaly_service

volumes:
  pgdata: